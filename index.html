<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesa de Truco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Semi+Condensed:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --madeira:#4a2c17; --madeira2:#2e1a0d;
    --feltro:#2d6b45; --feltro2:#1c4a2e;
    --giz:#f5ecd8;
    --copag-az:#1f4e9c; --copag-am:#f2c400; --copag-vm:#c62828; --copag-vd:#2e8b3e;
    --disp:"Alfa Slab One",Georgia,serif;
    --txt:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  .hidden{display:none !important}
  body{margin:0;font-family:var(--txt);font-size:24px;font-weight:500;color:var(--giz);
       background:
         repeating-linear-gradient(90deg,transparent 0 38px,#00000014 38px 41px),
         linear-gradient(180deg,var(--madeira),var(--madeira2));
       min-height:100vh}
  .screen{max-width:1080px;margin:0 auto;padding:14px 14px 40px}

  h1,h2{font-family:var(--disp);font-weight:400;letter-spacing:.02em;margin:0;color:var(--copag-am);
        text-shadow:2px 3px 0 #000000aa}
  h1{font-size:clamp(40px,8vw,72px);text-align:center;line-height:1.05;padding-top:28px}
  h2{font-size:34px}

  /* ---------- botões: placa pintada ---------- */
  button{font-family:var(--txt);font-weight:800;font-size:26px;letter-spacing:.04em;text-transform:uppercase;
         padding:14px 28px;border:0;border-radius:6px;cursor:pointer;margin:6px;
         color:#2e1a0d;background:linear-gradient(180deg,#ffd93d,var(--copag-am));
         box-shadow:0 4px 0 #8a6a00,0 6px 10px #00000066}
  button:hover{filter:brightness(1.06)}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6a00}
  button:disabled{opacity:.3;cursor:default;transform:none}
  button:focus-visible{outline:4px solid #fff;outline-offset:2px}
  .menu-btn{display:block;width:100%;max-width:520px;margin:24px auto;font-size:40px;padding:30px}
  .voltar{background:#00000055;color:var(--giz);font-size:20px;padding:8px 16px;box-shadow:none}
  .topo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .modos button,.opts button{font-size:20px;padding:8px 18px;background:#00000055;color:var(--giz);box-shadow:none}
  .modos button.on,.opts button.on{background:linear-gradient(180deg,#ffd93d,var(--copag-am));color:#2e1a0d}
  .opts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:6px 0 20px}
  .lbl2{text-align:center;font-size:26px;color:var(--copag-am);margin-top:18px;font-weight:700}

  /* ---------- placar de palitos sobre a madeira ---------- */
  .placar-t{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;padding:10px 14px;margin:10px 0 6px}
  .placar-t .lado{display:flex;flex-direction:column;gap:4px}
  .placar-t .lado.dir{align-items:flex-end}
  .placar-t .nome{font-size:20px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
  .placar-t .num{font-family:var(--disp);font-size:40px;line-height:1}
  .palitos{display:flex;gap:10px;height:46px;align-items:flex-end}
  .palitos svg{height:46px;width:auto;filter:drop-shadow(1px 2px 1px #00000088)}
  .vale{text-align:center;font-family:var(--disp);font-size:20px;color:var(--madeira2);
        background:var(--giz);padding:8px 16px;border-radius:4px;transform:rotate(-2deg);
        box-shadow:2px 3px 0 #00000055;min-width:120px}
  .vale b{display:block;font-size:40px;line-height:1;color:var(--copag-vm)}

  /* ---------- feltro ---------- */
  .feltro{position:relative;border-radius:26px;padding:18px 14px 16px;
          background:
            radial-gradient(ellipse at 50% 30%,#ffffff12,transparent 60%),
            repeating-radial-gradient(circle at 30% 40%,transparent 0 3px,#00000008 3px 4px),
            radial-gradient(ellipse at 50% 50%,var(--feltro),var(--feltro2) 90%);
          box-shadow:inset 0 0 0 6px #1a110a,inset 0 0 0 12px #6b4526,inset 0 0 60px #00000088,0 10px 30px #00000088}
  .msg{text-align:center;font-size:28px;font-weight:700;min-height:40px;margin:10px 0;text-shadow:0 2px 0 #00000088}
  .hand{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:10px 0}
  .mesa{display:flex;justify-content:center;gap:22px;align-items:flex-start;flex-wrap:wrap}
  .col{text-align:center}
  .lbl{font-size:18px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;margin-bottom:6px;text-align:center}
  .lbl.eu{color:var(--copag-am);opacity:1}
  .mini{display:flex;gap:4px;justify-content:center}
  .mini .card{width:42px;height:64px}
  .actions{text-align:center;margin-top:8px}
  .pilhas{display:flex;justify-content:center;gap:40px;align-items:flex-start;margin:8px 0}

  /* ---------- carta Copag espanhol ---------- */
  .card{width:104px;height:156px;background:#fffef7;color:#1a1a1a;border-radius:7px;position:relative;
        box-shadow:0 3px 6px #00000077;user-select:none;overflow:hidden;flex:none}
  .card::before{content:"";position:absolute;inset:6px;border:2px solid var(--copag-az);border-radius:3px;pointer-events:none}
  .card::after{content:"";position:absolute;inset:9px;border:1px solid var(--copag-az);border-radius:2px;pointer-events:none}
  /* carta com foto: a arte já tem borda e índices, some com a moldura desenhada */
  .card.foto{background:#fff}
  .card.foto::before,.card.foto::after{display:none}
  /* ponytail: fill estica ~3% (arte 0,65 x caixa 0,67). Invisível, e contain deixava
     8px de tarja branca de cada lado. Se um dia trocar de baralho, confira essa razão. */
  .card.foto img,.fc img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
  .card .n{position:absolute;font-family:Georgia,serif;font-weight:bold;font-size:24px;line-height:1}
  .card .n1{top:13px;left:13px}
  .card .n2{bottom:13px;right:13px;transform:rotate(180deg)}
  .card .pips{position:absolute;inset:14px;display:grid;place-items:center}
  .card .pips svg{width:100%;height:100%}
  .card.fig .pips{inset:0}
  .card .mid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .card .mid .uni{font-size:60px;font-family:Georgia,serif;font-weight:bold}
  .card.red{color:#c62828}
  .card.click{cursor:pointer;transition:transform .12s}
  .card.click:hover,.card.click:focus-visible{transform:translateY(-14px);box-shadow:0 12px 16px #00000099;outline:none}
  .card.new{box-shadow:0 0 0 4px var(--copag-am),0 3px 6px #00000077}
  .card.back{background:
      repeating-linear-gradient(45deg,transparent 0 6px,#c9302c 6px 8px),
      repeating-linear-gradient(-45deg,transparent 0 6px,#c9302c 6px 8px),#f7eeee}
  .card.back::before{border-color:#fff;border-width:3px}
  .card.back::after{display:none}
  /* ---- carta francesa (Cacheta) ---- */
  .fc{width:100px;height:150px;background:#fff;border-radius:8px;position:relative;overflow:hidden;
      box-shadow:0 3px 7px #00000055, inset 0 0 0 1px #00000014;border:1px solid #d9d4c8}
  .fc svg{display:block;width:100%;height:100%}
  .fc.jok{background:#fffdf4;border-color:#d8c98c}
  .fc.click{cursor:pointer} .fc.click:hover{transform:translateY(-10px);transition:.1s}
  .fc.new{box-shadow:0 0 0 3px var(--gold), 0 6px 14px #0007}
  .card.sm{width:72px;height:108px}
  .card.sm .n{font-size:17px}
  .card.sm .n1{top:10px;left:10px}.card.sm .n2{bottom:10px;right:10px}
  .card.sm .pips{inset:10px}
  .card.sm::before{inset:4px}.card.sm::after{inset:6px}
  .slot{width:104px;height:156px;border:3px dashed #ffffff44;border-radius:7px;flex:none}
  #c-lixo .fc{box-shadow:0 0 0 3px #f5ecd8cc,0 0 18px 4px #f5ecd855,0 3px 7px #00000055}

  /* ---- mesa da cacheta ---- */
  .mesa-wrap{position:relative;width:100%;max-width:980px;aspect-ratio:980/560;margin:8px auto 0}
  .mesa-oval{position:absolute;inset:0;border-radius:50%/50%;
    background:radial-gradient(ellipse at 50% 38%,#4bbd77 0%,#2f8f57 26%,#1f6b40 62%,#114529 100%);
    box-shadow:inset 0 0 60px #0006, 0 0 0 14px #6b3f1d, 0 0 0 18px #3f2310, 0 18px 40px #0008}
  .mesa-oval::before{content:"";position:absolute;inset:22px;border-radius:50%;
    border:2px solid #ffffff22;pointer-events:none}
  .centro{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);text-align:center}
  .centro .pilhas{gap:28px;margin:0}
  .centro .msg{font-size:22px;min-height:30px;margin:10px 0 0;text-shadow:0 2px 4px #000a}
  .seat{position:absolute;width:118px;transform:translate(-50%,-50%);text-align:center;transition:transform .2s}
  .seat .stack{position:relative;height:46px;margin:0 auto 4px;width:34px}
  .seat .stack .mini{position:absolute;width:30px;height:44px;border-radius:4px;
    background:repeating-linear-gradient(45deg,transparent 0 3px,#c9302c 3px 5px),
               repeating-linear-gradient(-45deg,transparent 0 3px,#c9302c 3px 5px),#fff4f2;
    border:1.5px solid #fff;box-shadow:0 1px 3px #0007}
  .seat .nome{font-family:Georgia,serif;font-size:19px;color:#fff;text-shadow:0 1px 3px #000c;line-height:1.1}
  .seat .pts{display:inline-block;margin-top:3px;min-width:34px;padding:2px 9px;border-radius:999px;
    background:#111;color:var(--gold);font-family:Arial,sans-serif;font-weight:bold;font-size:16px;
    border:2px solid var(--gold);box-shadow:0 2px 4px #0009}
  .seat.vez .nome{color:var(--gold)}
  .seat.vez .stack{filter:drop-shadow(0 0 8px var(--gold))}
  .seat.vez{transform:translate(-50%,-50%) scale(1.08)}
  /* anel da vez: o Cacheta League marca quem joga com um halo, nao com texto */
  .seat.vez::before{content:"";position:absolute;left:50%;top:50%;width:104px;height:104px;
    margin:-52px 0 0 -52px;border-radius:50%;pointer-events:none;z-index:-1;
    background:radial-gradient(circle,#f2c40040 0%,transparent 70%);
    box-shadow:0 0 0 3px #f2c400bb,0 0 22px 7px #f2c40055;
    animation:seat-anel 1.4s ease-in-out infinite}
  @keyframes seat-anel{50%{transform:scale(1.1)}}
  .seat.fora{opacity:.35;filter:grayscale(1)}
  .seat .dealer{position:absolute;top:-6px;right:6px;width:22px;height:30px;border-radius:3px;
    background:#b8222c;border:2px solid #f3d27a;font-size:9px;color:#f3d27a;line-height:26px;
    font-family:Arial,sans-serif;font-weight:bold;box-shadow:0 2px 4px #000a}
  .seat .balao{position:absolute;left:50%;top:-26px;transform:translateX(-50%);
    padding:3px 12px;border-radius:14px;font-family:Georgia,serif;font-size:16px;white-space:nowrap;
    background:#fffdf3;color:#1b1b1b;box-shadow:0 3px 8px #000a;animation:pop .25s ease-out}
  .seat .balao::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-6px;
    border:6px solid transparent;border-top-color:#fffdf3;border-bottom:0}
  .seat .balao.corro{background:#e9e4d8;color:#7a2b2b;font-style:italic}
  .seat .balao.vou{background:#f6e7a8;color:#3b2a00}
  .seat.eu .nome{font-size:20px}
  @keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){.seat .balao,.seat.vez::before{animation:none}.seat{transition:none}}
  .btn-rapido{position:absolute;top:4px;right:8px;z-index:3;font-size:19px;padding:10px 18px;
    background:#00000066;color:#fff;border:2px solid #ffffff44;margin:0}
  .btn-rapido.on{background:var(--gold);color:#2e1a0d;border-color:var(--gold)}
  @media (max-width:700px){.btn-rapido{font-size:15px;padding:7px 12px}}
  .versao{text-align:center;font-size:15px;opacity:.5;margin:18px 0 0}
  .versao button{font-size:18px;padding:10px 18px;background:var(--copag-am);
    color:#2e1a0d;opacity:1;font-weight:bold}
  .resumo{text-align:center;font-family:Georgia,serif;font-size:19px;color:#e9e2cd;
    opacity:.85;margin:10px 0 0;min-height:23px}
  .resumo.pronta{color:#7fe08a;opacity:1;font-weight:bold}
  .bloco{display:flex;flex-direction:column;align-items:center;gap:5px;
    padding:7px 8px 5px;border-radius:12px;background:#ffffff12}
  .bloco.fechado{background:#1c5c2a66;box-shadow:inset 0 0 0 2px #4caf5088}
  .bloco .cartas{display:flex}
  .bloco .cartas .fc{margin-left:-20px}
  .bloco .cartas .fc:first-child{margin-left:0}
  .etiqueta{font-family:Georgia,serif;font-size:15px;line-height:1.2;min-height:18px;
    color:transparent;letter-spacing:.5px;white-space:nowrap}
  .bloco.fechado .etiqueta{align-self:stretch;margin:2px -8px -5px;padding:3px 0;text-align:center;
    color:#0d2a12;background:#5bc46a;border-radius:0 0 10px 10px;font-weight:bold}
  .leque.solto .fc{margin-left:-22px}
  .leque.solto .fc:first-child{margin-left:0}
  .leque{display:flex;justify-content:center;align-items:flex-start;flex-wrap:wrap;gap:10px;margin:10px 0 0;padding:0 8px}
  .leque .fc{margin-left:-22px;transition:transform .12s;touch-action:none;cursor:grab}
  .leque .fc.drag{opacity:.6;transform:translateY(-16px) rotate(3deg);z-index:5;cursor:grabbing;
    box-shadow:0 12px 22px #000a;transition:none}
  .leque .fc:first-child{margin-left:0}
  .leque .fc.click:hover{transform:translateY(-16px);z-index:2}
  @media (max-width:700px){.seat{width:90px}.seat .nome{font-size:15px}.centro .msg{font-size:17px}
    .leque .fc{width:68px;height:102px;margin-left:-26px}}
  .bar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:22px;margin:4px 0 10px;opacity:.9}

  .overlay{position:fixed;inset:0;background:#000000c0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
  .box{background:var(--giz);color:var(--madeira2);border-radius:8px;padding:26px 28px;text-align:center;
       max-width:640px;box-shadow:4px 6px 0 #00000088;transform:rotate(-1deg)}
  .box p{font-family:var(--disp);font-size:30px;margin:0 0 18px;line-height:1.2}
  #modal-vira{display:flex;flex-direction:column;align-items:center;gap:6px;margin:0 0 16px}
  #modal-vira span{font-family:var(--txt);font-size:18px;color:var(--madeira2)}
  #modal-vira b{font-family:var(--disp);font-size:22px}
  details{background:#00000044;border-radius:8px;padding:10px 16px;margin-top:22px;font-size:20px;line-height:1.45}
  summary{cursor:pointer;font-size:22px;color:var(--copag-am);font-weight:700}
  @media (prefers-reduced-motion:reduce){ .card.click{transition:none} }
  @media (max-width:560px){
    .card{width:78px;height:117px}.slot{width:78px;height:117px}
    .card .n{font-size:19px}.card .n1{top:10px;left:10px}.card .n2{bottom:10px;right:10px}
    .card .pips{inset:10px}.placar-t .num{font-size:30px}
  }
  /* =============== TRUCO: mesa (prefixo tt-) =============== */
  #scr-truco{max-width:none;padding:8px 12px 10px}
  .tt-table{position:absolute;left:6%;right:6%;top:0;bottom:0;
    background:
      radial-gradient(ellipse at 50% 40%,#3c9a5c 0%,#2a7f47 40%,#1f6a3a 75%,#17552e 100%);
    border:14px solid #2b2b2b;border-top-width:12px;border-bottom-width:12px;
    box-shadow:inset 0 0 0 3px #b38b4f, inset 0 0 80px 10px #0007, 0 0 0 4px #1a1a1a, 0 0 40px #0008}
  .tt-table::before{content:"";position:absolute;inset:10px;border:2px solid #ffffff18;border-radius:6px;pointer-events:none}

  /* placar a giz no feltro */
  .tt-placar{position:absolute;left:10%;top:6%;z-index:2;color:#b8f0a8;font-size:22px;letter-spacing:.06em;
    text-shadow:0 1px 2px #0008;display:grid;grid-template-columns:auto auto;gap:2px 26px;align-items:baseline}
  .tt-placar b{font-family:var(--disp);font-size:34px;line-height:1;text-align:right}
  .tt-placar .pal{grid-column:1/-1;height:34px;display:flex;gap:8px}
  .tt-placar .pal svg{height:34px;filter:drop-shadow(0 1px 1px #0008)}
  .tt-vale{position:absolute;right:10%;top:6%;z-index:2;text-align:center;color:#fffdf3;font-size:18px;letter-spacing:.08em;
    text-transform:uppercase;text-shadow:0 2px 3px #000a}
  .tt-vale > b{display:block;font-family:var(--disp);font-size:44px;line-height:1;color:var(--copag-am)}
  .tt-vale.alto > b{color:#ff6b5b;animation:tt-pulse 1s infinite}
  @keyframes tt-pulse{50%{transform:scale(1.12)}}

  /* cadeiras */
  .tt-seat{position:absolute;transform:translate(-50%,-50%);text-align:center;width:150px;z-index:3}
  .tt-av{width:86px;height:86px;margin:0 auto;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:54px;line-height:1;border:4px solid #fff;box-shadow:0 6px 14px #000a;
    background:linear-gradient(160deg,#f7e6c8,#dcb98a)}
  .tt-av img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
  .tt-seat.amigo .tt-av{background:linear-gradient(160deg,#cfe3ff,#8fb6ea)}
  .tt-seat .tt-nome{margin-top:5px;display:inline-block;padding:3px 12px;border-radius:999px;background:#000a;color:#fff;
    font-size:18px;font-weight:700;letter-spacing:.03em;white-space:nowrap}
  .tt-seat.vez .tt-av{box-shadow:0 0 0 5px var(--copag-am),0 0 26px 8px #f2c400aa;animation:tt-pulse 1.2s infinite}
  .tt-seat.vez .tt-nome{background:var(--copag-am);color:#2e1a0d}
  .tt-backs{position:absolute;width:110px;height:70px;transform:translate(-50%,-50%);z-index:2}
  .tt-backs .card{position:absolute;width:48px;height:70px;left:50%;top:0;margin-left:-24px;transform-origin:50% 110%;box-shadow:0 3px 6px #000a}
  .tt-backs .card::before{inset:4px;border-width:2px}
  .tt-balao{position:absolute;left:50%;top:-12px;transform:translate(-50%,-100%);padding:8px 18px;border-radius:18px;
    background:#fffdf3;color:#1b1b1b;font-family:var(--disp);font-size:24px;white-space:nowrap;
    box-shadow:0 4px 10px #000b;animation:tt-pop .25s ease-out;z-index:6}
  .tt-balao::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-8px;border:8px solid transparent;border-top-color:#fffdf3;border-bottom:0}
  .tt-balao.grito{background:var(--copag-vm);color:#fff;font-size:30px}
  .tt-balao.grito::after{border-top-color:var(--copag-vm)}
  @keyframes tt-pop{from{transform:translate(-50%,-100%) scale(.5);opacity:0}to{transform:translate(-50%,-100%) scale(1);opacity:1}}

  /* cartas jogadas */
  .tt-slot{position:absolute;transform:translate(-50%,-50%);z-index:2}
  .tt-slot .card{width:96px;height:144px;box-shadow:0 6px 12px #000a;transform:rotate(var(--rot,0deg))}
  .tt-slot .card.in{animation:tt-play .4s cubic-bezier(.2,.8,.3,1)}
  .tt-slot .card.ganhou{box-shadow:0 0 0 5px var(--copag-am),0 0 28px 6px #f2c400aa,0 6px 12px #000a}
  @keyframes tt-play{from{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(-30deg);opacity:0}}

  /* monte + vira */
  .tt-deck{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:212px;height:136px;z-index:1}
  .tt-deck .card{position:absolute;width:88px;height:132px;left:0;top:0;box-shadow:0 2px 4px #000a}
  .tt-deck .card::before{inset:4px;border-width:2px}.tt-deck .card::after{display:none}
  .tt-deck .vira{left:90px;top:0;transform:rotate(90deg);width:88px;height:132px;z-index:2;box-shadow:0 4px 8px #000b}
  .tt-deck .vira .n{font-size:21px}.tt-deck .vira .n1{top:7px;left:7px}.tt-deck .vira .n2{bottom:7px;right:7px}
  .tt-deck .vira .pips{inset:10px}.tt-deck .vira::before{inset:4px;border-width:1.5px}.tt-deck .vira::after{inset:6px}
  .tt-manilha{margin-top:10px;font-size:17px;letter-spacing:0;text-transform:none;color:#fff;opacity:.95;line-height:1.25}
  .tt-manilha b{font-family:var(--disp);font-size:24px;color:var(--copag-am)}

  @media (max-width:760px){
          .tt-vazas .lin b,.tt-vazas .lin span{font-size:12px}
  }

  /* sua mão */
  .tt-bottom{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);z-index:5;
    display:flex;align-items:flex-end;justify-content:center;gap:24px}
  .tt-bottom.comparceiro{left:50%}
  .tt-hand{display:flex;align-items:flex-end}

</head>

<script>
"use strict";
const $ = s => document.getElementById(s);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

/* =========================================================
   CARTAS DO TRUCO — fotos em cartas/es/*.png (baralho Basquetteur)
   O=ouros/moeda, E=espada, C=copa, P=paus/basto
   ========================================================= */
const NAIPE_NOME  = { P:"Gato", C:"Copa", E:"Espada", O:"Mole" };
const NAIPE_FORCA = { O:1, E:2, C:3, P:4 };          // mole < espada < copa < gato
const ES_ARQ      = { O:"oros", E:"espadas", C:"copas", P:"bastos" };

function cardEl(c, cls, onclick){
  const d = document.createElement("div");
  if(!c) d.className = "card back " + (cls||"");
  else{
    d.className = "card foto " + (cls||"");
    d.innerHTML = `<img src="cartas/es/${String(c.r).padStart(2,"0")}-${ES_ARQ[c.s]}.png" alt="">`;
    d.setAttribute("aria-label", c.r + " de " + NAIPE_NOME[c.s]);
  }
  if(onclick){ d.classList.add("click"); d.onclick = onclick; d.tabIndex = 0;
               d.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); onclick(); } }; }
  return d;
}

/* placar de palitos de fósforo: grupos de 5 (4 em pé + 1 atravessado) */
function palitosSVG(n){
  const grupos = [];
  for(let i=0;i<n;i+=5) grupos.push(Math.min(5, n-i));
  return grupos.map(g=>{
    let s = `<svg viewBox="0 0 ${g>=5?60:12*g+8} 46">`;
    for(let k=0;k<Math.min(g,4);k++)
      s += `<rect x="${6+k*12}" y="6" width="4" height="38" rx="1.5" fill="#e8c38a"/>
            <rect x="${5+k*12}" y="4" width="6" height="8" rx="3" fill="#b3261e"/>`;
    if(g===5) s += `<g transform="rotate(-12 28 23)"><rect x="0" y="21" width="56" height="4" rx="1.5" fill="#e8c38a"/>
                    <rect x="-1" y="19" width="9" height="7" rx="3" fill="#b3261e"/></g>`;
    return s + `</svg>`;
  }).join("");
}
function slot(){ const d=document.createElement("div"); d.className="slot"; return d; }
function fill(id, nodes){ const e=$(id); e.innerHTML=""; nodes.forEach(n=>e.appendChild(n)); }
function coluna(rotulo, node, destaque){
  const d = document.createElement("div"); d.className = "col";
  const l = document.createElement("div"); l.className = "lbl" + (destaque?" eu":"");
  l.textContent = rotulo; d.appendChild(l); d.appendChild(node); return d;
}

function voltar(){ ["scr-menu","scr-truco","scr-cacheta-cfg","scr-cacheta"].forEach(i=>$(i).classList.add("hidden"));
                   $("scr-menu").classList.remove("hidden"); fecharModal(); }
function mostrar(id){ ["scr-menu","scr-truco","scr-cacheta-cfg","scr-cacheta"].forEach(i=>$(i).classList.add("hidden"));
                      $(id).classList.remove("hidden"); }
function modal(txt, botoes, vira){
  // a caixa fica no meio da mesa e tapa o vira; quando a decisão depende dele, mostra aqui
  const v = $("modal-vira");
  v.innerHTML = "";
  v.classList.toggle("hidden", !vira);
  if(vira){
    v.appendChild(cardEl(vira));
    v.insertAdjacentHTML("beforeend",
      `<span>vira <b>${vira.r}</b> &middot; manilha <b>${T.manilha}</b></span>`);
  }
  $("modal-txt").textContent = txt;
  const b = $("modal-btns"); b.innerHTML = "";
  botoes.forEach(([lbl,fn])=>{ const x=document.createElement("button"); x.textContent=lbl;
    x.onclick=()=>{ fecharModal(); fn(); }; b.appendChild(x); });
  $("modal").classList.remove("hidden");
}
function fecharModal(){ $("modal").classList.add("hidden"); }

/* =========================================================
   TRUCO — baralho espanhol 40 cartas, manilha móvel pelo vira.
   Mesmo motor para 1x1 (2 assentos) e dupla 2x2 (4 assentos).
   Assento 0 = você. Time 0 = "p" (você/sua dupla), time 1 = "b".
   ========================================================= */
const T_ORDEM  = ["4","5","6","7","10","11","12","1","2","3"];   // fraca -> forte
const T_NAIPES = ["O","E","C","P"];
const proxValor  = v => ({1:3,3:6,6:9,9:12})[v] || null;
const nomeAposta = v => ({3:"TRUCO",6:"SEIS",9:"NOVE",12:"DOZE"})[v];
const NOMES = { 2:["Você","Máquina"], 4:["Você","Adversário 1","Parceiro","Adversário 2"] };

let T = null;
let modoTruco = 2;

const manilhaDe = vira => TRUCO.manilhaDe(vira);
const forcaM = TRUCO.forca;
function forca(c){ return TRUCO.forca(c, T.manilha); }

const timeSigla = t => t === 0 ? "p" : "b";
const assentosDoTime = t => T.times.map((x,i)=>x===t?i:-1).filter(i=>i>=0);

function abrirTruco(){
  mostrar("scr-truco");
  modal("Como quer jogar?", [["Sozinho (1 x 1)", ()=>setModoTruco(2)], ["Em dupla (2 x 2)", ()=>setModoTruco(4)]]);
}

function setModoTruco(n){
  modoTruco = n;
  $("t-m2").classList.toggle("on", n===2);
  $("t-m4").classList.toggle("on", n===4);
  T = { n, times: n===2 ? [0,1] : [0,1,0,1], placar:[0,0], abreMao:0, dif: dificuldade,
        persona: Array.from({length:n}, ()=>PERSONAS[(Math.random()*PERSONAS.length)|0]) };
  $("t-df").textContent = DIF_NOME[dificuldade];
  novaMao();
}

function novaMao(){
  const baralho = shuffle(T_ORDEM.flatMap(r => T_NAIPES.map(s => ({r,s}))));
  T.aReceber = []; for(let i=0;i<T.n;i++) T.aReceber.push(baralho.slice(i*3, i*3+3));
  T.maos = []; for(let i=0;i<T.n;i++) T.maos.push([]);
  T.vira = baralho[T.n*3]; T.manilha = manilhaDe(T.vira);
  $("t-aposta").classList.add("hidden");
  T.vazas = []; T.jogadas = []; T.viradas = []; for(let i=0;i<T.n;i++) T.viradas.push([]); T.parceiroAberto = false; T.valor = 1; T.pendente = null; T.ultimoPediu = null; T.fim = false;
  T.travada = false;
  T.abreVaza = T.abreMao;
  // estado neutro pro render enquanto as cartas caem
  T.mesa = new Array(T.n).fill(null); T.ordem = []; T.pos = 0;
  T.ultimaJogada = -1; T.balao = null;
  T.msg = "Dando as cartas...";
  render();
  darCartasTruco(0);
}
/* uma carta por jogador, na volta da mesa */
function darCartasTruco(k){
  if(k >= 3){ iniciarVaza(); return; }
  for(let i=0;i<T.n;i++){
    const a = (T.abreMao + i) % T.n;
    T.maos[a].push(T.aReceber[a][k]);
  }
  render();
  setTimeout(()=>darCartasTruco(k+1), 170);
}

function iniciarVaza(){
  T.mesa = new Array(T.n).fill(null); T.ultimaJogada = -1; T.balao = null;
  // sentido anti-horário: da sua direita pra sua esquerda
  T.ordem = []; for(let k=0;k<T.n;k++) T.ordem.push(((T.abreVaza - k) % T.n + T.n) % T.n);
  T.pos = 0;
  if(T.vazas.length === 0 && maoDeOnze()) return;   // decisão antes da primeira carta
  seguir();
}

/* =========================================================
   MÃO DE ONZE — quem chega a 11 olha as cartas (e a do parceiro)
   e escolhe: vai valendo 3, ou não vai e entrega 1 ponto.
   11 x 11: os dois são obrigados a ir, vale 3.
   Em qualquer mão com um 11 na mesa, não se pede truco.
   ========================================================= */
function maoDeOnze(){
  const onze = [0,1].filter(t => T.placar[t] === 11);
  if(!onze.length) return false;
  T.valor = 3; T.travada = true;

  if(onze.length === 2){
    T.msg = "Onze a onze! Os dois vão, vale 3 — quem ganhar, ganha.";
    render();
    return false;                                  // segue o jogo normal
  }
  const time = onze[0];
  if(time === 0){
    if(T.n === 4) T.parceiroAberto = quem === "p" ? "b" : "p";   // só o time que responde consulta         // consulta a mão do parceiro pra decidir
    T.msg = "Mão de onze: olhe as cartas e decida.";
    render();
    barraAposta("Mão de onze — vale 3. Vai ou não vai?", [
      ["Vou!",     ()=>{ T.parceiroAberto = false; reg("onze", {vai:true});
                         T.msg = "Mão de onze valendo 3!"; render(); seguir(); }],
      ["Não vou",  ()=>{ T.parceiroAberto = false; reg("onze", {vai:false});
                         T.msg = "Não foram na mão de onze — 1 ponto pra eles.";
                         fimDaMao("b", 1); }]
    ]);
  } else {
    T.msg = "Mão de onze deles...";
    render();
    setTimeout(()=>{
      const a = TRUCO.assentoQueDecide(T, time), P = paramsDoBot(a);
      // vai se a mão paga o risco: ganhar fecha o jogo, correr custa só 1
      if(TRUCO.probMao(T, a, P.sims, Math.random) > 0.55){
        T.balao = { a, txt:"Vou!", grito:true };
        T.msg = "Foram na mão de onze — vale 3!";
        render(); seguir();
      } else {
        T.balao = { a, txt:"Não vou." };
        T.msg = "Não foram na mão de onze — 1 ponto é seu.";
        fimDaMao("p", 1);
      }
    }, 1100);
  }
  return true;
}

function seguir(){
  if(T.fim) return;
  if(T.pos >= T.n) return resolverVaza();
  const a = T.ordem[T.pos];
  T.msg = a === 0 ? "Sua vez! Escolha uma carta." : `${NOMES[T.n][a]} pensando...`;
  render();
  if(a !== 0) setTimeout(()=>turnoBot(a), 1000);
}

const AVATAR = { 2:["👴","🤖"], 4:["👴","🧔","👩","👨‍🦰"] };
/* assento 0 = o dono do jogo. Se perfil/pai.jpg nao existir, o onerror devolve o emoji. */
const avatarHTML = a => a === 0 ? `<img src="${JOGADOR.foto}" alt="" onerror="this.replaceWith('${JOGADOR.emoji}')">` : AVATAR[T.n][a];
// posições (% da mesa) por assento: av = avatar, bk = cartas viradas, sl = carta jogada
const POS = {
  2:{ 1:{av:[50,8], bk:[50,21], sl:[50,36]}, 0:{sl:[50,68]} },
  4:{ 1:{av:[10,50], bk:[24,50], sl:[35,52]}, 2:{av:[50,8], bk:[50,21], sl:[50,36]},
      3:{av:[90,50], bk:[76,50], sl:[65,52]}, 0:{sl:[50,68]} }
};
const pct = (el,[x,y]) => { el.style.left = x+"%"; el.style.top = y+"%"; };

/* a mesa tem tamanho fixo e encolhe junto (transform) até caber na tela */
/* Cada carta da mão ganha uma abinha "esconder". Clicar na aba joga a carta
   de costas (perde a rodada, mas ninguém vê o que era); clicar na carta joga
   normal. Mais claro que um botão de modo separado. */
function montaCartaDaMao(c, i, minhaVez){
  const el = cardEl(c, "", minhaVez ? ()=>jogar(0, i, false) : null);
  // regra da casa: na primeira rodada ninguém esconde
  if(minhaVez && T.vazas.length >= 1){
    const aba = document.createElement("span");
    aba.className = "tt-esc-aba";
    aba.textContent = "esconder";
    aba.title = "Joga de costas: perde a rodada, mas ninguém vê a carta";
    aba.onclick = e => { e.stopPropagation(); jogar(0, i, true); };
    el.appendChild(aba);
  }
  return el;
}

function ajustaMesa(){
  const fit = $("t-fit"), st = $("tt-stage");
  if(!fit || !st || $("scr-truco").classList.contains("hidden")) return;
  const jogo = fit.parentElement;
  // desconta as colunas laterais pra saber quanto sobra pra mesa
  let usado = 0; jogo.querySelectorAll("aside").forEach(a => usado += a.offsetWidth + 14);
  let larg = jogo.clientWidth - usado;
  if(larg < 260) larg = jogo.clientWidth;          // empilhado (celular): usa tudo
  // altura medida a partir do topo do bloco: nao depende do tamanho que acabei de aplicar
  const alt  = window.innerHeight - (jogo.offsetTop || 0) - 16;
  const s = Math.max(0.28, Math.min(larg/1200, alt/760));
  st.style.transform = "scale(" + s + ")";
  fit.style.width  = (1200*s) + "px";   // fit do tamanho da mesa: as colunas encostam nela
  fit.style.height = (760*s) + "px";
}
addEventListener("resize", ajustaMesa);

function render(){
  const nomeTime = s => T.n===4 ? (s==="p"?"Nós":"Eles") : (s==="p"?"Você":"Máquina");
  $("t-lbl-p").textContent = nomeTime("p"); $("t-lbl-b").textContent = nomeTime("b");
  $("t-sp").textContent = T.placar[0]; $("t-sb").textContent = T.placar[1];
  $("t-pal-p").innerHTML = palitosSVG(T.placar[0]); $("t-pal-b").innerHTML = palitosSVG(T.placar[1]);
  $("t-val").textContent = T.valor;
  $("t-vale-box").classList.toggle("alto", T.valor > 1);

  const vez = (!T.fim && T.pos < T.n) ? T.ordem[T.pos] : -1;
  const stage = $("tt-stage"), W = stage.clientWidth || 1200, H = stage.clientHeight || 760;

  // cadeiras dos outros
  const seats = [];
  for(let a=1;a<T.n;a++){
    const p = POS[T.n][a];
    const s = document.createElement("div");
    s.className = "tt-seat" + (T.times[a]===0?" amigo":"") + (a===vez?" vez":"");
    pct(s, p.av);
    s.innerHTML = `<div class="tt-av">${avatarHTML(a)}</div><span class="tt-nome">${NOMES[T.n][a]}</span>`;
    if(T.balao && T.balao.a===a) s.insertAdjacentHTML("afterbegin",
      `<div class="tt-balao${T.balao.grito?" grito":""}">${T.balao.txt}</div>`);
    seats.push(s);
    const bk = document.createElement("div"); bk.className = "tt-backs"; pct(bk, p.bk);
    const n = T.maos[a].length, rot = [-14,0,14].slice(0,n);
    T.maos[a].forEach((_,k)=>{ const c = cardEl(null); c.style.transform = `rotate(${rot[k] - (n===2?7:0)}deg)`; bk.appendChild(c); });
    seats.push(bk);
  }
  fill("tt-seats", seats);

  // balão meu
  const you = $("tt-you");
  you.classList.toggle("vez", vez===0);
  you.querySelector(".tt-balao")?.remove();
  if(T.balao && T.balao.a===0) you.insertAdjacentHTML("afterbegin",
    `<div class="tt-balao${T.balao.grito?" grito":""}" style="left:60px">${T.balao.txt}</div>`);

  // monte + vira
  const deck = $("t-deck"); deck.innerHTML = "";
  [0,1,2].forEach(k=>{ const c = cardEl(null); c.style.left = (k*1.5)+"px"; c.style.top = (-k*1.5)+"px"; deck.appendChild(c); });
  const v = cardEl(T.vira, "vira"); deck.appendChild(v);
  $("t-manilha").innerHTML = `Manilha: <b>${T.manilha}</b><br><small>${T_NAIPES.slice().reverse().map(s=>NAIPE_NOME[s]).join(" › ")}</small>`;

  // cartas jogadas
  const fim = T.pos >= T.n;
  const lider = liderAtual();
  const slots = [];
  T.mesa.forEach((c,a)=>{
    if(!c) return;
    const d = document.createElement("div"); d.className = "tt-slot"; pct(d, POS[T.n][a].sl);
    const el = cardEl(c.virada ? null : c);
    el.style.setProperty("--rot", ((a*37)%9-4)+"deg");
    if(a === T.ultimaJogada){
      const from = a===0 ? [50,110] : POS[T.n][a].av, to = POS[T.n][a].sl;
      el.style.setProperty("--dx", ((from[0]-to[0])*W/100)+"px");
      el.style.setProperty("--dy", ((from[1]-to[1])*H/100)+"px");
      el.classList.add("in");
    }
    if(fim && lider && forca(c)===lider.f) el.classList.add("ganhou");
    d.appendChild(el); slots.push(d);
  });
  fill("tt-slots", slots);

  // minha mão — sem dica nenhuma, quem lê a carta é o jogador
  const minhaVez = !T.fim && !T.pendente && vez === 0;
  fill("t-phand", T.maos[0].map((c,i)=>
    montaCartaDaMao(c, i, minhaVez)));

  // mão do parceiro aberta: grande, ao lado da sua
  const par = parceiroVisivel(0);
  $("t-bottom").classList.toggle("comparceiro", par >= 0);
  $("t-phand").classList.toggle("comparceiro", par >= 0);
  const pw = $("t-parhand");
  pw.classList.toggle("hidden", par < 0);
  if(par >= 0){
    pw.innerHTML = '<div class="tag">Mão do Parceiro</div>';
    const box = document.createElement("div"); box.className = "cartas";
    T.maos[par].forEach(c => box.appendChild(cardEl(c)));
    pw.appendChild(box);
  }
  $("t-msg").textContent = T.msg;
  ajustaMesa();
  $("t-vazas").innerHTML = '<div class="cab">Rodadas</div>' + [0,1,2].map(k=>{
    const r = T.vazas[k];
    const txt = r ? (r === "t" ? "Empate" : nomeTime(r)) : "—";
    return `<div class="lin ${r || "vazio"}"><b>${k+1}ª</b><span>${txt}</span></div>`;
  }).join("");

  const prox = proxValor(T.valor);
  const bt = $("t-truco");
  bt.textContent = T.travada ? "Mão de onze" : (prox ? nomeAposta(prox) + "!" : "—");
  bt.disabled = !(minhaVez && prox && !T.travada && T.ultimoPediu !== "p");
}
window.addEventListener("resize", ()=>{ if(T && !$("scr-truco").classList.contains("hidden")) render(); });

function jogar(a, i, virada){
  if(T.fim || T.pendente || T.ordem[T.pos] !== a) return;
  const carta = T.maos[a].splice(i,1)[0];
  // carta virada: perde a rodada, mas ninguém fica sabendo o que era
  if(virada){ carta.virada = true; (T.viradas[a] = T.viradas[a] || []).push({ r:carta.r, s:carta.s }); }
  else T.jogadas.push(carta);
  T.mesa[a] = carta; T.ultimaJogada = a;
  if(a === 0) reg("jogou", { carta: chaveC(carta), virada: !!virada, manilha:T.manilha, vale:T.valor, restam:T.maos[0].length });
  T.pos++;
  seguir();
}

/* --- quem está ganhando a rodada agora: {assento, forca} ou null --- */
function liderAtual(){
  let melhor = null;
  T.mesa.forEach((c,i)=>{ if(c && (!melhor || forca(c) > melhor.f)) melhor = {i, f:forca(c)}; });
  return melhor;
}

/* =========================================================
   O motor mora em truco_core.js (mesmo arquivo que o treinador
   usa). Aqui ficam só as amarras com a tela.

   Os números vieram de auto-jogo: 14 gerações de mutação e
   seleção, validadas em 800 partidas. Ver truco_dna.json.
   ========================================================= */
const CAMPEAO = {
  pedir:0.88, subir:0.96, margem:0.25, freqPede:0.30, pagaPraVer:0.02,
  blefe:0.00, bl3:0.33, bl6:0.20, bl9:0.08, blefeMin:0.22, blefeMax:0.35,
  mSaida:0.24, mPrimeira:0.55, mGanhouPrimeira:1.09,
  mSemCartas:0.74, mSemCartasExposto:0.33,
  cegoPedir:0.04, cegoBlefe:0.30, cegoFreq:0.64
};

/* Blefe custa vitória contra qualquer adversário medido (0.10 de blefe
   tira ~6 pontos percentuais). Então blefe deixou de ser "esperteza" e
   virou o handicap dos níveis fáceis: quanto mais fácil, mais o bot
   blefa e mais frouxo ele aceita. No difícil ele joga a conta seca. */
const DIF = {
  facil:   Object.assign({}, CAMPEAO, { sims:24,  erro:0.30, blefe:0.30,
             pedir:0.55, subir:0.62, margem:-0.10, freqPede:0.75, pagaPraVer:0.30 }),
  normal:  Object.assign({}, CAMPEAO, { sims:90,  erro:0.10, blefe:0.14,
             pedir:0.70, subir:0.80, margem:0.05, freqPede:0.50, pagaPraVer:0.15 }),
  dificil: Object.assign({}, CAMPEAO, { sims:260, erro:0 })
};
const DIF_ORDEM = ["facil","normal","dificil"];
const DIF_NOME  = { facil:"Fácil", normal:"Normal", dificil:"Difícil" };
let dificuldade = "dificil";

/* Personalidade: pequenos desvios no DNA, pra cada bot da mesa jogar
   de um jeito. Sem isso os quatro assentos são clones. */
const PERSONAS = [
  { nome:"calmo",   pedir:+0.05, freqPede:-0.10, blefe:0.6 },
  { nome:"valente", pedir:-0.07, freqPede:+0.20, blefe:1.8 },
  { nome:"raposa",  pedir:-0.01, freqPede:+0.05, blefe:1.2 }
];

/* ---- leitura do adversário ----
   Medido no simulador: contra quem corre muito, subir freqPede de 0.30
   para 0.90 vale +14 pontos percentuais. Blefar não vale nada (quem
   corre te entrega só 1 ponto). Então o bot não blefa mais contra o
   medroso — ele pede mais vezes, com mão de verdade. */
function leituraDoAdversario(){
  try{
    const L = JSON.parse(localStorage.getItem("leitura_" + JOGADOR.id) || "null");
    if(!L || (L.trucosRecebidos || 0) < 6) return null;   // pouca amostra: não inventa
    return L.correu / L.trucosRecebidos;
  }catch(e){ return null; }
}
function anotaResposta(correu){
  try{
    const k = "leitura_" + JOGADOR.id;
    const L = JSON.parse(localStorage.getItem(k) || '{"trucosRecebidos":0,"correu":0}');
    L.trucosRecebidos++; if(correu) L.correu++;
    localStorage.setItem(k, JSON.stringify(L));
  }catch(e){}
}

function paramsDoBot(a){
  const d = DIF[T.dif] || DIF.dificil;
  const per = (T.persona && T.persona[a]) || PERSONAS[0];
  const P = Object.assign({}, d);
  P.pedir    = Math.max(0.35, Math.min(0.98, P.pedir + per.pedir));
  P.freqPede = Math.max(0.10, Math.min(1.00, P.freqPede + per.freqPede));
  P.blefe    = P.blefe * per.blefe;

  const fuga = leituraDoAdversario();
  if(fuga !== null && T.dif !== "facil"){
    // corre muito? pede mais. paga tudo? aperta a mão e cobra caro.
    P.freqPede = Math.max(P.freqPede, Math.min(0.95, 0.30 + fuga * 0.75));
    if(fuga < 0.25) P.margem = Math.max(P.margem, 0.30);
  }
  return P;
}

function ciclaDificuldade(){
  dificuldade = DIF_ORDEM[(DIF_ORDEM.indexOf(dificuldade)+1) % DIF_ORDEM.length];
  if(T) T.dif = dificuldade;
  $("t-df").textContent = DIF_NOME[dificuldade];
}

/* ---- amarras: o core opera direto sobre T ---- */
const parceiroDe      = a => TRUCO.parceiroDe(T, a);
const parceiroVisivel = a => TRUCO.parceiroVisivel(T, a);
const chaveC          = TRUCO.chave;

function botResponde(time){
  const a = TRUCO.assentoQueDecide(T, time);
  const acao = TRUCO.responde(T, time, paramsDoBot(a), Math.random);
  if(acao === "subir")   return pedirTruco(a);
  if(acao === "aceitar") return aceitar(timeSigla(time));
  correr(timeSigla(time));
}

function turnoBot(a){
  if(T.fim || T.pendente || T.ordem[T.pos] !== a) return;
  const P = paramsDoBot(a);
  if(!T.travada && proxValor(T.valor) && TRUCO.querPedir(T, a, P, Math.random))
    return pedirTruco(a);
  const d = TRUCO.decideCarta(T, a, P, Math.random);
  jogar(a, d.i, d.virada);
}

function resolverVaza(){
  const jogadas = T.mesa.map((c,i)=>({c,i})).filter(o=>o.c);
  const maxF  = Math.max(...jogadas.map(o=>forca(o.c)));
  const topos = jogadas.filter(o=>forca(o.c) === maxF);
  const times = new Set(topos.map(o=>T.times[o.i]));
  const r = times.size > 1 ? "t" : timeSigla(T.times[topos[0].i]);
  T.vazas.push(r);
  const nomeTime = s => T.n===4 ? (s==="p"?"Sua dupla":"Os adversários") : (s==="p"?"Você":"A máquina");
  T.msg = r === "t" ? "Rodada empatada." : `${nomeTime(r)} ganhou a rodada!`;
  render();

  const dono = donoDaMao(T.vazas);
  setTimeout(()=>{
    if(dono !== null) return fimDaMao(dono, T.valor);
    T.abreVaza = (r === "t") ? T.abreVaza : topos[0].i;   // empate: reabre quem abriu
    iniciarVaza();
    // tempo de olhar a mesa antes de recolher as cartas
  }, T.n === 4 ? 3400 : 2600);
}

// null = indefinido; "p"/"b" = time vencedor; "n" = mão anulada
const donoDaMao = TRUCO.donoDaMao;

/* ---------------- apostas ---------------- */
/* gíria de mesa — o bot responde como gente, não como caixa de diálogo */
const FALAS = {
  pede:   { 3:["TRUCO!","Truco, ladrão!","Truco!"], 6:["SEIS!","Seis!"], 9:["NOVE!"], 12:["DOZE!"] },
  aceita: ["Tô dentro!","Manda ver!","Pode vir!","Tô junto!","Vem que tem!","Cara a cara!"],
  corre:  ["Corro...","Tá teu.","Essa é tua.","Não vou não.","Fica pra próxima."]
};
const fala = arr => arr[(Math.random()*arr.length)|0];

function barraAposta(txt, botoes){
  const b = $("t-aposta");
  b.innerHTML = `<span class="txt">${txt}</span>`;
  botoes.forEach(([lbl,fn])=>{ const x = document.createElement("button"); x.textContent = lbl;
    x.onclick = ()=>{ b.classList.add("hidden"); fn(); }; b.appendChild(x); });
  b.classList.remove("hidden");
  b.querySelector("button").focus({preventScroll:true});
}

function pedirTruco(a){
  const prox = proxValor(T.pendente || T.valor);
  if(!prox || T.fim || T.travada) return;          // mão de onze: ninguém pede
  const quem = timeSigla(T.times[a]);
  if(T.ultimoPediu === quem) return;
  T.pendente = prox; T.ultimoPediu = quem; T.pediuAssento = a; if(T.n === 4) T.parceiroAberto = quem === "p" ? "b" : "p";   // só o time que responde consulta T.balao = { a, txt: fala(FALAS.pede[prox]), grito:true };
  reg("pediu", { quem: a===0 ? "voce" : "bot", assento:a, aposta:prox });
  T.msg = `${NOMES[T.n][a]} pediu ${nomeAposta(prox)}!`;
  render();

  const respondente = quem === "p" ? 1 : 0;              // time que responde
  if(respondente === 0){
    const opcoes = [["Aceitar", ()=>{ anotaResposta(false); aceitar("p"); }],
                    ["Correr",  ()=>{ anotaResposta(true);  correr("p"); }]];
    if(proxValor(prox)) opcoes.push([nomeAposta(proxValor(prox)), ()=>pedirTruco(0)]);
    barraAposta(`${NOMES[T.n][a]} pediu ${nomeAposta(prox)}. E aí?`, opcoes);
  } else {
    setTimeout(()=>botResponde(respondente), 900);
  }
}

function aceitar(quem){
  T.parceiroAberto = false;   // consultou pra decidir; decidiu, fecha
  reg("aceitou", { quem: quem==="p" ? "voce" : "bot", aposta:T.pendente });
  T.valor = T.pendente; T.pendente = null;
  T.balao = { a: assentosDoTime(quem==="p"?0:1)[0], txt: fala(FALAS.aceita) };
  const suaVez = T.pos < T.n && T.ordem[T.pos] === 0;
  T.msg = (quem === "p" ? (T.n===4 ? "Vocês toparam" : "Você topou") : "Toparam!")
        + ` Vale ${T.valor}` + (suaVez ? " — manda ver!" : ".");
  render();
  const a = T.ordem[T.pos];
  if(T.pos < T.n && a !== 0) setTimeout(()=>turnoBot(a), 1000);
}

function correr(quem){
  T.parceiroAberto = false;
  reg("correu", { quem: quem==="p" ? "voce" : "bot", valia:T.valor });
  T.balao = { a: assentosDoTime(quem==="p"?0:1)[0], txt: fala(FALAS.corre) };
  T.msg = quem === "p" ? "Vocês correram." : "Correram! Ponto é seu.";
  fimDaMao(quem === "p" ? "b" : "p", T.valor);
}

function fimDaMao(vencedor, pontos){
  reg("fim_mao", { vencedor, pontos });
  T.pendente = null;
  if(vencedor === "n") T.msg = "Mão empatada — ninguém pontua.";
  else{
    T.placar[vencedor === "p" ? 0 : 1] += pontos;
    const quem = vencedor === "p" ? (T.n===4?"Sua dupla fez ":"Você fez ") : "Os adversários fizeram ";
    T.msg = quem + pontos + (pontos>1 ? " pontos." : " ponto.");
  }
  T.mesa = new Array(T.n).fill(null);
  render();

  if(T.placar[0] >= 12 || T.placar[1] >= 12){
    T.fim = true;
    const ganhou = T.placar[0] >= 12;
    setTimeout(()=>modal(ganhou ? "Vocês venceram o jogo!" : "Os adversários venceram. Revanche?",
      [["Jogar de novo", ()=>setModoTruco(T.n)], ["Sair da mesa", voltar]]), 1200);
    return;
  }
  T.abreMao = ((T.abreMao - 1) % T.n + T.n) % T.n;
  setTimeout(novaMao, 3000);
}

/* =========================================================
   CACHETA — 2 baralhos (108 cartas, 4 coringas), 6–10 jogadores,
   regras da casa: declaração vou/corro, pontos 10/−1/−2, recompra
   ========================================================= */
/* regras, política e simulação moram em cacheta_core.js — o mesmo motor que
   o treinador usa. Aqui em cima fica só a interface. */
const C_ORDEM = CAC.ORDEM, C_NAIPES = CAC.NAIPES, JOKER = CAC.JOKER;
/* cartas/fr/<rank>_of_<naipe>.png — nomes do baralho Byron Knoll */
const FR_R = { A:"ace", J:"jack", Q:"queen", K:"king" };
const FR_S = { "♦":"diamonds", "♠":"spades", "♥":"hearts", "♣":"clubs" };
const FR_ARQ = c => ehCoringa(c) ? "red_joker" : (FR_R[c.r] || c.r) + "_of_" + FR_S[c.s];
const ci = CAC.ci, ehCoringa = CAC.ehCoringa;
let G = null;
let CFG = { nj: 6, dif: "medio" };

const ehJogo = CAC.ehJogo, fecha = CAC.fecha, indiceParaBater = CAC.indiceParaBater;

/* deixa a mão arrumada: jogos fechados, depois pares, coringa na direita */
function ordenar(m){ const o = CAC.organizarMao(m); m.length = 0; o.forEach(c=>m.push(c)); return m; }

/* tabela aprendida no treinador (treino.html). Sem ela o bot usa o palpite do motor. */
let TABELA = null;
try{ TABELA = JSON.parse(localStorage.getItem("cacheta_tabela") || "null"); }catch(e){}

const NIVEL_POL = {
  facil:   Object.assign({}, CAC.POL_PADRAO, { ruidoDecl:.45, ruidoDesc:14, perigo:0, ganhoLixo:99 }),
  medio:   Object.assign({}, CAC.POL_PADRAO, { ruidoDecl:.12, ruidoDesc:4 }),
  dificil: Object.assign({}, CAC.POL_PADRAO)
};
const POL = () => NIVEL_POL[(G && G.dif) || CFG.dif] || CAC.POL_PADRAO;
const pontuar = cs => CAC.pontuar(cs, POL());
const melhorDescarte = mao => CAC.escolherDescarte(mao, POL(), G && G.perigo);

/* ---- quem está na mesa (separa o histórico de cada um) ---- */
const JOGADORES = [
  { id:"rogerio", nome:"Rogério", foto:"perfil/pai.jpg",   emoji:"👴" },
  { id:"fabio",   nome:"Fábio",   foto:"perfil/fabio.jpg", emoji:"🧑" }
];
let JOGADOR = JOGADORES[0];

function escolherJogador(){

(function(){

/* ---- registro de jogadas: Supabase + cópia local ---- */
const SB_URL = "https://yvwfyhjhxbvxpcqejdsa.supabase.co";
const SB_KEY = "sb_publishable_Xv7FzSBFEFozSc9EoEdGcg_WTtOltFp";
const SESSAO = Date.now().toString(36);

const maoStr = m => m.map(c=>c.r+(c.s||"")).join(" ");

/* ---- configuração ---- */
const C_NOMES = ["Você","Beto","Cida","Duda","Edu","Fabi","Gil","Hugo","Iara","Juca"];
function abrirCacheta(){
  mostrar("scr-cacheta-cfg");
  const nj = $("cfg-nj"); nj.innerHTML = "";
  for(let n=6;n<=10;n++){ const b=document.createElement("button"); b.textContent=n;
    b.className = CFG.nj===n?"on":""; b.onclick=()=>{CFG.nj=n; abrirCacheta();}; nj.appendChild(b); }
  const dif = $("cfg-dif"); dif.innerHTML = "";
  [["facil","Fácil"],["medio","Médio"],["dificil","Difícil"]].forEach(([k,lbl])=>{
    const b=document.createElement("button"); b.textContent=lbl;
    b.className = CFG.dif===k?"on":""; b.onclick=()=>{CFG.dif=k; abrirCacheta();}; dif.appendChild(b); });
}
function cacComecar(){
  G = {
    dif: CFG.dif,
    jog: Array.from({length:CFG.nj}, (_,i)=>({ nome:C_NOMES[i], humano:i===0, pts:10, fora:false })),
    dealer: (Math.random()*CFG.nj)|0,
  };
  mostrar("scr-cacheta");
  cacNovaRodada();
}

/* ---- rodada ---- */
function vivos(){ return G.jog.filter(j=>!j.fora); }
function ordemDesde(d){ // dealer+1, dealer+2, ..., dealer — pulando quem está fora
  const o=[]; const n=G.jog.length;
  for(let k=1;k<=n;k++){ const j=G.jog[(d+k)%n]; if(!j.fora) o.push(j); }
  return o;
}
function cacNovaRodada(){
  const baralho = CAC.embaralhar(CAC.novoBaralho());
  G.jog.forEach(j=>{ if(!j.fora){ j.aReceber = baralho.splice(0,9); j.mao = []; j.foi = null; } });
  G.deck = baralho; G.lixo = [];
  G.ordem = ordemDesde(G.dealer);          // último = dealer
  G.fase = "dando"; G.di = 0; G.rapido = false;
  G.comprou = false; G.nova = null; G.fim = false;
  G.perigo = new Set();
  G.msg = "Dando as cartas...";
  cacRender();
  darCartas(0);
}
/* uma carta por vez, na volta da mesa, como na mesa de verdade */
function darCartas(k){
  if(k >= 9){
    ordenar(G.jog[0].mao);
    G.fase = "declara"; G.msg = "";
    cacRender();
    setTimeout(proxDeclara, 300);
    return;
  }
  G.ordem.forEach(j => j.mao.push(j.aReceber[k]));
  cacRender();
  setTimeout(()=>darCartas(k+1), 105);
}
function proxDeclara(){
  if(G.di >= G.ordem.length){ fimDeclara(); return; }
  const j = G.ordem[G.di];
  const ehDealer = G.di === G.ordem.length-1;
  const ninguemFoi = G.ordem.slice(0,G.di).every(x=>x.foi===false);
  if(ehDealer && ninguemFoi){                       // dealer obrigado
    j.foi = true;
    G.msg = j.nome + (j.humano?" (você)":"") + " é obrigado a ir — ninguém foi.";
    G.di++; cacRender(); setTimeout(proxDeclara, espera(1000)); return;
  }
  if(j.humano){
    G.msg = "Sua vez: você vai ou corre?";
    cacRender(); return;                            // espera o clique
  }
  // bot declara: mesma conta de EV do motor, com a tabela aprendida se houver
  const jaForam = G.ordem.slice(0, G.di).filter(x=>x.foi).length;
  const vai = CAC.decidirIr(
    { falta: CAC.falta(j.mao), jaForam, nMesa: G.ordem.length, pts: j.pts, obrigado:false },
    POL(), TABELA);
  j.foi = vai;
  G.msg = j.nome + (vai ? " vai." : " correu.");
  G.di++; cacRender(); setTimeout(proxDeclara, espera(700));
}
function cacDeclarar(vai){
  const j = G.ordem[G.di];
  if(G.fase!=="declara" || !j || !j.humano) return;
  j.foi = vai;
  reg("declara", { mao:maoStr(j.mao), pts:j.pts, foi:vai, pos:G.di, njRodada:G.ordem.length });
  G.di++; cacRender(); setTimeout(proxDeclara, 400);
}
function fimDeclara(){
  const foram = G.ordem.filter(j=>j.foi);
  if(foram.length === 1){
    G.msg = foram[0].nome + " ganhou sozinho — ninguém mais foi!";
    return fimRodada(foram[0]);
  }
  // quem correu devolve as 9 cartas pro monte, que volta embaralhado
  G.ordem.forEach(j=>{ if(!j.foi && j.mao.length){ G.deck.push(...j.mao); j.mao = []; } });
  shuffle(G.deck);
  G.fase = "jogo";
  G.ativos = G.ordem.filter(j=>j.foi);
  G.vi = 0;
  proxVez();
}
function proxVez(){
  if(G.fim) return;
  const j = G.ativos[G.vi];
  G.comprou = false; G.nova = null;
  if(j.humano){ G.msg = "Sua vez — compre uma carta."; cacRender(); return; }
  G.msg = j.nome + " jogando...";
  cacRender();
  setTimeout(()=>botJoga(j), espera(800));
}
function repor(){
  if(G.deck.length || !G.lixo.length) return;
  const topo = G.lixo.pop();
  G.deck = shuffle(G.lixo); G.lixo = [topo];
}
function passaVez(){
  G.vi = (G.vi+1) % G.ativos.length;
  proxVez();
}

/* ---- humano joga ---- */
function cacComprar(de){
  const j = G.ativos && G.ativos[G.vi];
  if(G.fase!=="jogo" || !j || !j.humano || G.comprou) return;
  if(de==="monte"){ repor(); if(!G.deck.length) return; G.nova = G.deck.pop(); }
  else{ if(!G.lixo.length) return; G.nova = G.lixo.pop(); }
  reg("compra", { de, carta:G.nova.r+G.nova.s, mao:maoStr(j.mao) });
  j.mao.push(G.nova); G.comprou = true;   // entra na ponta; quem organiza é o jogador
  G.msg = "Agora descarte uma carta — ou bata.";
  cacRender();
}
function cacDescartar(i){
  const j = G.ativos && G.ativos[G.vi];
  if(G.fase!=="jogo" || !j || !j.humano || !G.comprou) return;
  const c = j.mao[i];
  reg("descarta", { carta:c.r+c.s, mao:maoStr(j.mao) });
  G.lixo.push(j.mao.splice(i,1)[0]);
  passaVez();
}
function cacBater(){
  const j = G.ativos && G.ativos[G.vi];
  if(!j || !j.humano) return;
  // mão de 9 já fechada: compra e a décima vai direto pro lixo, como manda a
  // regra. Sem isso o jogador tinha que dar um clique de compra sem sentido.
  if(!G.comprou){
    if(!(j.mao.length === 9 && fecha(j.mao))) return;
    repor();
    if(!G.deck.length) return;
    G.lixo.push(G.deck.pop());
    reg("bateu", { mao: maoStr(j.mao), direto: true });
    G.msg = "Você bateu!";
    return fimRodada(j);
  }
  const i = indiceParaBater(j.mao);
  if(i === -1) return;
  reg("bateu", { mao:maoStr(j.mao) });
  G.lixo.push(j.mao.splice(i,1)[0]);
  G.msg = "Você bateu!";
  fimRodada(j);
}

/* ---- bot joga ---- */
function botJoga(j){
  if(G.fim) return;
  const topo = G.lixo[G.lixo.length-1];
  let pegou = false;
  if(topo && CAC.pegarDoLixo(j.mao, topo, POL())){
    j.mao.push(G.lixo.pop()); pegou = true;
    G.perigo.add(topo.r); G.perigo.add(topo.s);   // ele quer isso: não alimentar
  }
  if(!pegou){ repor(); if(!G.deck.length) return fimRodada(null); j.mao.push(G.deck.pop()); }

  const bi = indiceParaBater(j.mao);
  if(bi !== -1){
    G.lixo.push(j.mao.splice(bi,1)[0]);
    G.msg = j.nome + " bateu!";
    return fimRodada(j);
  }
  const di = melhorDescarte(j.mao);
  G.lixo.push(j.mao.splice(di,1)[0]);
  passaVez();
}

/* ---- fim de rodada, pontos, recompra ---- */
function fimRodada(vencedor){
  G.fim = true; G.fase = "fim";
  if(!vencedor) G.msg = "Acabaram as cartas — rodada anulada.";
  else{
    G.ordem.forEach(j=>{
      if(j === vencedor) return;                    // bateu/ganhou: mantém
      j.pts = Math.max(0, j.pts - (j.foi ? 2 : 1)); // foi e perdeu −2, correu −1
    });
    reg("rodada", { venceu: vencedor.humano, pontos: G.jog.map(j=>j.pts) });
  }
  cacRender();
  setTimeout(trataZerados, espera(1400));
}
function trataZerados(){
  const z = G.ordem.find(j => j.pts===0 && !j.fora);
  if(!z) return fimOuProxima();
  const vivosComPonto = G.jog.filter(j=>!j.fora && j.pts>0);
  if(!vivosComPonto.length) return fimOuProxima();
  const minPts = Math.min(...vivosComPonto.map(j=>j.pts));
  if(z.humano){
    modal("Você zerou! Recomprar e voltar com "+minPts+" ponto(s)? (Se recusar, está fora do jogo.)",
      [["Recomprar", ()=>{ z.pts = minPts; reg("recompra",{aceitou:true,pts:minPts}); trataZerados(); }],
       ["Ficar fora", ()=>{ z.fora = true; reg("recompra",{aceitou:false}); trataZerados(); }]]);
  }else{
    // ponytail: bot recompra 1 vez; ilimitado deixaria o jogo sem fim
    z.rec = (z.rec||0)+1;
    if(z.rec<=1){ z.pts = minPts; G.msg = z.nome+" recomprou com "+minPts+" ponto(s)."; }
    else{ z.fora = true; G.msg = z.nome+" está fora do jogo."; }
    cacRender();
    setTimeout(trataZerados, espera(900));
  }
}
function fimOuProxima(){
  const v = vivos();
  const eu = G.jog[0];
  if(v.length <= 1){
    const win = v[0];
    modal(win ? (win.humano ? "VOCÊ VENCEU O JOGO!" : win.nome+" venceu o jogo.") : "Jogo encerrado.",
      [["Jogar de novo", cacComecar],["Menu", voltar]]);
    return;
  }
  if(eu.fora){
    modal("Você ficou fora do jogo.", [["Jogar de novo", cacComecar],["Menu", voltar]]);
    return;
  }
  // próximo dealer: próximo vivo depois do atual
  let d = G.dealer;
  do{ d = (d+1)%G.jog.length; }while(G.jog[d].fora);
  G.dealer = d;
  cacNovaRodada();
}

/* ---- render ---- */
function cacRender(){
  if(!G) return;
  const vezJog = G.fase==="jogo" ? G.ativos[G.vi]
               : G.fase==="declara" ? G.ordem[G.di] : null;
  // cadeiras em elipse; humano (índice 0) embaixo, sentido anti-horário
  const cx = $("c-seats").parentElement;
  const n = G.jog.length;
  const W = cx.clientWidth || 980, H = cx.clientHeight || W*560/980;
  const raioX = Math.max(40, W/2 - (W < 560 ? 38 : 70));
  const raioY = Math.max(40, H/2 - (W < 560 ? 42 : 58));
  // mesa cheia em tela baixa: o montinho de cartas sai pra ninguém encavalar
  $("c-seats").classList.toggle("cheia", n >= 9);
  fill("c-seats", G.jog.map((j,i)=>{
    const ang = Math.PI/2 + (i/n)*2*Math.PI;
    const x = W/2 + Math.cos(ang)*raioX, y = H/2 + Math.sin(ang)*raioY;
    const d = document.createElement("div");
    d.className = "seat" + (j===vezJog?" vez":"") + (j.fora?" fora":"") + (j.humano?" eu":"");
    d.style.left = x+"px"; d.style.top = y+"px";
    const cartas = j.fora || j.foi===false ? 0 : Math.min(9,(j.mao||[]).length);
    const stack = Array.from({length:Math.min(cartas,4)},(_,k)=>
      '<div class="mini" style="left:'+(k*2)+'px;top:'+(-k*2)+'px"></div>').join("");
    const balao = j.foi===true && G.fase!=="fim" ? '<div class="balao vou">vou</div>'
                : j.foi===false ? '<div class="balao corro">corro</div>' : "";
    d.innerHTML = balao + '<div class="stack">'+stack+'</div>'
      + '<div class="nome">'+j.nome+'</div><div class="pts">'+j.pts+'</div>'
      + (G.jog[G.dealer]===j ? '<div class="dealer" title="dá as cartas">D</div>' : "");
    return d;
  }));
  $("c-deck").textContent = G.deck ? G.deck.length : 0;

  const eu = G.jog[0];
  const minhaVez = vezJog && vezJog.humano;
  const podeComprar = G.fase==="jogo" && minhaVez && !G.comprou && !G.fim;
  fill("c-monte", [ G.deck && G.deck.length ? cardEl(null,"",podeComprar?()=>cacComprar("monte"):null) : slot() ]);
  fill("c-lixo",  [ G.lixo && G.lixo.length
      ? cardCac(G.lixo[G.lixo.length-1],"",podeComprar?()=>cacComprar("lixo"):null) : slot() ]);

  const podeDescartar = G.fase==="jogo" && minhaVez && G.comprou && !G.fim;
  // A mão só é redesenhada quando muda de verdade. Sem isso, cada bot que
  // declarava disparava um cacRender e arrancava a carta da mão do jogador
  // no meio do arrasto.
  const cont = $("c-phand");
  const assinatura = (eu.mao||[]).map(c=>c.r+c.s).join(",") + "|" + podeDescartar
                   + "|" + (G.nova ? G.nova.r+G.nova.s : "");
  if(!cont._arrastando && cont._assinatura !== assinatura){
    cont._assinatura = assinatura;
    cont.classList.remove("solto");
    cont.innerHTML = "";
    CAC.gruposVisiveis(eu.mao || []).forEach(g=>{
      const bl = document.createElement("div");
      bl.className = "bloco" + (g.tipo ? " fechado" : "");
      const linha = document.createElement("div");
      linha.className = "cartas";
      g.cartas.forEach(c=>{
        const el = cardCac(c, c===G.nova ? "new" : "", null);
        el._c = c;
        if(podeDescartar){ el.classList.add("click"); el._click = ()=>cacDescartar(eu.mao.indexOf(c)); }
        linha.appendChild(el);
      });
      bl.appendChild(linha);
      const et = document.createElement("div");
      et.className = "etiqueta";
      et.textContent = g.tipo || "";
      bl.appendChild(et);
      cont.appendChild(bl);
    });
  }
  arrastavel(cont);

  // quantas cartas faltam pra bater — é o que decide o vou/corro
  const res = $("c-resumo");
  const m = eu.mao || [];
  if(G.fim || !m.length) res.textContent = "";
  else if(m.length === 9){
    const f = CAC.falta(m);
    res.textContent = f === 0 ? "Mão fechada!"
      : "Falta " + f + (f === 1 ? " carta" : " cartas") + " pra bater";
    res.classList.toggle("pronta", f === 0);
  }else{ res.textContent = ""; res.classList.remove("pronta"); }
  $("c-msg").textContent = G.msg;

  // só aparece quando você já está fora da rodada — não tem o que esperar
  const eu_fora = eu.foi === false || (G.fase==="jogo" && G.ativos && !G.ativos.includes(eu));
  const mostrarRapido = eu_fora && G.fase !== "fim";
  $("c-rapido").classList.toggle("hidden", !mostrarRapido);
  $("c-rapido").classList.toggle("on", !!G.rapido);
  $("c-rapido").textContent = G.rapido ? "RÁPIDO ✓" : "AVANÇAR ▶▶";

  const declara = G.fase==="declara" && minhaVez;
  $("c-vou").classList.toggle("hidden", !declara);
  $("c-corro").classList.toggle("hidden", !declara);
  // mão fechada com 9 cartas: pode bater sem comprar antes
  const maoFechada = eu.mao && eu.mao.length === 9 && fecha(eu.mao);
  const podeBater = (podeDescartar && indiceParaBater(eu.mao) !== -1)
                 || (G.fase === "jogo" && minhaVez && !G.comprou && maoFechada);
  // se fechou mas ainda não é sua vez, avisa em vez de sumir com o botão
  const esperando = maoFechada && !podeBater && G.fase !== "fim" && !G.fim;
  $("c-bater").classList.toggle("hidden", !(podeBater || esperando));
  $("c-bater").disabled = !podeBater;
  $("c-bater").textContent = podeBater ? "BATER!" : "MÃO FECHADA — espere sua vez";
}

const espera = ms => (G && G.rapido) ? Math.max(30, ms/12) : ms;

/* arrasta as cartas da mão pra reorganizar (mouse e toque).
   A ordem do DOM vira a ordem da mão no soltar. */
function arrastavel(cont){
  if(cont._pronto) return; cont._pronto = true;
  let alvo = null, movido = false, x0 = 0;
  cont.addEventListener("pointerdown", e=>{
    const el = e.target.closest(".fc"); if(!el || !cont.contains(el)) return;
    // desmancha os blocos antes de capturar o ponteiro: com as cartas soltas
    // o arraste atravessa bloco sem precisar saber que blocos existem
    const cartas = [...cont.querySelectorAll(".fc")];
    cont.innerHTML = "";
    cont.classList.add("solto");
    cartas.forEach(c => cont.appendChild(c));
    alvo = el; movido = false; x0 = e.clientX; cont._arrastando = true;
    el.setPointerCapture(e.pointerId); el.classList.add("drag");
  });
  cont.addEventListener("pointermove", e=>{
    if(!alvo) return;
    if(Math.abs(e.clientX - x0) > 6) movido = true;
    for(const n of [...cont.children]){
      if(n === alvo) continue;
      const r = n.getBoundingClientRect(), meio = r.left + r.width/2;
      const pos = n.compareDocumentPosition(alvo);
      if(e.clientX < meio && (pos & Node.DOCUMENT_POSITION_FOLLOWING)){ cont.insertBefore(alvo, n); break; }
      if(e.clientX > meio && (pos & Node.DOCUMENT_POSITION_PRECEDING)){ cont.insertBefore(alvo, n.nextSibling); break; }
    }
  });
  const soltar = ()=>{
    cont._arrastando = false;
    if(!alvo) return;
    alvo.classList.remove("drag");
    const nova = [...cont.children].map(n=>n._c).filter(Boolean);
    if(G && nova.length === G.jog[0].mao.length){ G.jog[0].mao = nova; cont._assinatura = null; }
    const clique = (!movido && alvo._click) || null;
    alvo = null;
    if(clique) clique(); else cacRender();
  };
  cont.addEventListener("pointerup", soltar);
  cont.addEventListener("pointercancel", soltar);
}

/* cartas da cacheta: cartas/fr/*.png (Byron Knoll) — ver FR_ARQ */

function cardCac(c, cls, onclick){
  const d = document.createElement("div");
  const red = c && (c.s === "♥" || c.s === "♦" || ehCoringa(c));
  d.className = "fc " + (cls || "") + (red ? " red" : "") + (c && ehCoringa(c) ? " jok" : "");
  d.innerHTML = `<img src="cartas/fr/${FR_ARQ(c)}.png" alt="">`;
  d.setAttribute("aria-label", ehCoringa(c) ? "coringa" : c.r + " de " + c.s);
  if(onclick){ d.classList.add("click"); d.onclick = onclick; }
  return d;
}

/* O GitHub Pages manda o navegador guardar a página por 10 minutos, então
   dava pra corrigir algo, publicar, abrir e ver a versão velha sem perceber.
   Aqui embaixo o jogo diz qual versão carregou e avisa quando tem outra. */
(function(){
  const el = document.getElementById("versao");
  if(!el) return;
  const carregada = new Date(document.lastModified);
  const quando = carregada.toLocaleString("pt-BR",
    { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });
  el.textContent = "versão de " + quando;
  if(location.protocol === "file:") return;
  fetch(location.href, { cache:"no-store", method:"HEAD" }).then(r=>{
    const lm = r.headers.get("last-modified");
    if(lm && new Date(lm).getTime() > carregada.getTime() + 2000){
      el.innerHTML = '<button onclick="location.reload(true)">Tem versão nova — tocar para atualizar</button>';
    }
  }).catch(()=>{});
})();
